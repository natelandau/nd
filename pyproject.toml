[project]
    authors = [{ name = "Nathaniel Landau", email = "github@natelandau.com" }]
    classifiers = [
        "Development Status :: 4 - Beta",
        "Environment :: Console",
        "Intended Audience :: System Administrators",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: System :: Systems Administration",
        "Topic :: Utilities",
        "Typing :: Typed",
    ]
    dependencies = [
        "httpx2>=2.13.1,<3.0.0",
        "lark>=1.3.1,<2.0.0",
        "msgspec>=0.22.0",
        "nclutils>=3.4.4,<4.0.0",
        "python-hcl2>=8.1.4,<9.0.0",
        "rich>=15.0.0",
        "typer>=0.27.3",
    ]
    description = "A friendly command-line tool for managing a HashiCorp Nomad homelab cluster."
    keywords = ["cli", "devops", "hashicorp", "homelab", "nomad", "orchestration"]
    license = "MIT"
    license-files = ["LICENSE"]
    name = "nomadctl"
    readme = "README.md"
    requires-python = ">=3.13, <3.16"
    version = "0.7.0"

    [project.urls]
        Homepage   = "https://github.com/natelandau/nd"
        Issues     = "https://github.com/natelandau/nd/issues"
        Repository = "https://github.com/natelandau/nd"

    [project.scripts]
        nd = "nd:main"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.13.0,<0.14"]

# Distribution is published as "nomadctl"; the importable module and `nd`
# CLI command stay "nd", so pin the packaged module name explicitly.
[tool.uv.build-backend]
    module-name = "nd"

[dependency-groups]
    dev = [
        "commitizen>=4.19.2",
        "coverage>=7.16.2",
        "duty>=1.10.1",
        "gate-cache>=0.12.0",
        "prek>=0.5.5",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.3.0",
        "pytest-httpx2>=1.0.0",
        "pytest-mock>=3.16.0",
        "pytest-randomly>=5.1.0",
        "pytest-repeat>=0.9.4",
        "pytest-sugar>=1.1.1",
        "pytest>=9.1.1",
        "respx>=0.23.1",
        "ruff>=0.17.0",
        "ty>=0.0.86",
        "typos>=1.51.1",
        "yamllint>=1.38.0",
]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_files              = ["src/nd/__init__.py:__version__"]
    version_provider           = "uv"

[tool.coverage.report]
    exclude_also = ['def __repr__', 'except [\w\s\._]+ as .*:', 'if TYPE_CHECKING']
    fail_under   = 10
    show_missing = true
    skip_covered = true
    skip_empty   = true

[tool.coverage.run]
    branch       = true
    command_line = "--module pytest"
    data_file    = ".cache/coverage"
    source       = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest]
    cache_dir            = ".cache/pytest"
    columns              = "120"
    faulthandler_timeout = "60"
    filterwarnings       = ["error"]
    required_plugins     = ["pytest-devtools", "pytest-httpx2", "pytest-mock", "pytest-randomly"]
    set_columns          = true
    strict               = true
    testpaths            = ["tests"]

[tool.ruff]
    fix           = true
    line-length   = 100
    output-format = "grouped"
    src           = ["src", "tests"]

    [tool.ruff.lint]
        ignore = [
            "COM812", # Conflicts with the formatter
            "CPY001", # No copyright header
            "D107",   # Class docstrings document __init__ arguments
            "E501",   # The formatter owns line length
            "FIX002", # TODO comments are allowed
            "TD001",  # Invalid TODO tag
            "TD002",  # Missing author in TODO
            "TD003",  # Missing issue link in TODO
        ]
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # Unused import
            "F841",   # Unused variable
        ]

        [tool.ruff.lint.per-file-ignores]
            # Typer callbacks take one positional parameter per CLI option
            "src/nd/commands/*.py" = ["PLR0917"]
            "tests/**/*.py" = [
                "ANN001",  # Missing argument annotation (fixtures)
                "ANN003",  # Missing **kwargs annotation
                "ANN201",  # Missing return annotation
                "ARG001",  # Unused function argument (fixtures)
                "ARG005",  # Unused lambda argument
                "PLC0415", # Import inside a test body
                "PLR0913", # Too many arguments (fixtures)
                "PLR2004", # Magic value in comparison
                "PLW0108", # Unnecessary lambda
                "S101",    # assert
                "SLF001",  # Private member access
            ]

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 7

        [tool.ruff.lint.flake8-annotations]
            allow-star-arg-any = true

[tool.ty.terminal]
    error-on-warning = true
