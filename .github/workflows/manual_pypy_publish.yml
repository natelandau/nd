---
name: "Manual PyPI Publish"

on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    publish-to-pypi:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # PyPI trusts only this repository's publish workflows running in the pypi environment
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: $/.github/actions/setup_python_env
              with:
                  python-version: "3.13"
                  enable-cache: "false"

            - name: Build the package
              shell: bash
              run: uv build

            - name: Upload to PyPI
              run: uv publish --trusted-publishing always
