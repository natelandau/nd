---
name: "Reusable Tests"

on:
    workflow_call:
        inputs:
            run-coverage:
                description: "Run coverage"
                required: false
                type: boolean
                default: false
        secrets:
            CODECOV_TOKEN:
                required: false

permissions:
    contents: read

jobs:
    test-python-code:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            # Finish every Python version so one failure shows whether it is version-specific
            fail-fast: false
            matrix:
                python-version: ["3.13", "3.14", "3.15"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: $/.github/actions/setup_python_env
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run tests
              shell: bash
              run: uv run duty test

            - name: Upload coverage to Codecov
              if: ${{ inputs.run-coverage && matrix.python-version == '3.13' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: .cache/coverage.xml
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    lint-project:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: $/.github/actions/setup_python_env

            - name: Cache prek hook environments
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/prek
                  key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Run all linters
              shell: bash
              run: uv run duty lint
