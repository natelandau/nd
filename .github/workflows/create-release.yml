---
name: "Create Release"

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g., v0.2.0)"
                required: true
                type: string
    push:
        tags:
            - "v*"

# Never cancel a release that is already publishing
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    run-tests:
        uses: ./.github/workflows/reusable-tests.yml

    autorelease:
        name: Create Release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: run-tests
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env
              with:
                  python-version: "3.13"
                  enable-cache: "false"

            - name: Add version to environment vars
              run: echo "PROJECT_VERSION=$(uv version --short)" >> "$GITHUB_ENV"

            - name: Check if tag version matches project version
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      TAG="$INPUT_TAG"
                      if ! git rev-parse "$TAG" >/dev/null 2>&1; then
                          echo "::error::Tag $TAG does not exist"
                          exit 1
                      fi
                  else
                      TAG=$(git describe HEAD --tags --abbrev=0)
                  fi

                  if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then
                      echo "::error::Tag $TAG does not match project version v$PROJECT_VERSION"
                      exit 1
                  fi

            - name: Build the package
              run: uv build

            - name: Upload the built package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error

            - name: Extract release notes from the changelog
              run: |
                  awk -v heading="## v${PROJECT_VERSION} " \
                      'index($0, heading) == 1 { found = 1; next } found && /^## v/ { exit } found { print }' \
                      CHANGELOG.md > release-notes.md
                  if [[ ! -s release-notes.md ]]; then
                      echo "::error::CHANGELOG.md has no section for v$PROJECT_VERSION"
                      exit 1
                  fi

            - name: Create Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v$PROJECT_VERSION" \
                      --verify-tag \
                      --title "v$PROJECT_VERSION" \
                      --notes-file release-notes.md \
                      dist/*-"$PROJECT_VERSION"-py3-none-any.whl \
                      dist/*-"$PROJECT_VERSION".tar.gz

    publish-to-pypi:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: autorelease
        # PyPI trusts only this repository's publish workflows running in the pypi environment
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download the built package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Setup uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: false

            - name: Upload to PyPI
              run: uv publish --trusted-publishing always
