---
name: Install uv, Python, and project dependencies
description: Install uv, Python, and project dependencies using cached uv and Python installations

inputs:
  python-version:
    description: >
      Version range or exact version of a Python version to use, using SemVer's version range syntax.
    required: false
    default: "3.13"

  install-groups:
    description: "Groups to install with uv sync"
    required: false
    default: "--all-extras --all-groups"

  enable-cache:
    description: "Restore and save the uv cache. Turn off for jobs that build release artifacts."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup uv with cache
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}

    # --locked fails the job when uv.lock is out of date with pyproject.toml
    - name: Install the project
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.install-groups }}
      # INSTALL_GROUPS holds several flags, so it is left unquoted to split into arguments
      run: uv sync --locked $INSTALL_GROUPS

    - name: Minimize uv cache
      if: ${{ inputs.enable-cache == 'true' }}
      shell: bash
      run: uv cache prune --ci
